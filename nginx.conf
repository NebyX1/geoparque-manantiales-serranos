server {
  listen 8080;
  listen [::]:8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  charset utf-8;
  server_tokens off;

  gzip on;
  gzip_comp_level 6;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_types text/plain text/markdown text/css text/javascript application/javascript application/json application/xml image/svg+xml;

  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
  add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; font-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; connect-src 'self' __SERRANA_API_ORIGIN__; base-uri 'self'; form-action 'self'; frame-ancestors 'self'" always;
  add_header_inherit merge;

  location = /health {
    access_log off;
    default_type text/plain;
    add_header Cache-Control "no-store";
    return 200 "ok\n";
  }

  location = /api/serrana/chat {
    client_max_body_size 24k;
    client_body_timeout 10s;
    # Refresh the service address when Compose replaces its container.
    resolver 127.0.0.11 valid=5s;
    resolver_timeout 3s;
    set $serrana_backend "${SERRANA_BACKEND_URL}";
    proxy_pass $serrana_backend;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header Connection "";
    proxy_connect_timeout 3s;
    proxy_read_timeout 75s;
    proxy_buffering off;
    gzip off;
  }

  location ~ \.md$ {
    default_type text/markdown;
    add_header Cache-Control "public, max-age=0, must-revalidate" always;
    try_files $uri =404;
  }

  location ~ ^/lugares/[^/]+\.pdf$ {
    default_type application/pdf;
    add_header Content-Disposition "attachment" always;
    add_header Cache-Control "public, max-age=0, must-revalidate" always;
    try_files $uri =404;
  }

  location ~ ^/_astro/.*\.(?:css|js|woff2?|png|jpe?g|webp|avif|svg)$ {
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    try_files $uri =404;
  }

  location ~* \.(?:html|txt|xml|md)$ {
    add_header Cache-Control "public, max-age=0, must-revalidate" always;
    try_files $uri =404;
  }

  location ~ /\. {
    deny all;
  }

  location / {
    add_header Cache-Control "public, max-age=0, must-revalidate" always;
    try_files $uri $uri/ =404;
  }

  error_page 404 /404.html;
  location = /404.html {
    internal;
    add_header Cache-Control "public, max-age=0, must-revalidate" always;
  }
}
